name: Rust Build and Test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build
        run: cargo build

      - name: Run Tests
        run: cargo test

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt --check
